# Python reference environment for the gpt_sovits_text parity fixtures.
# Versions are pinned so the golden fixtures and data files are reproducible.
# See parity/README.md. Run tasks from the repository root with
#   pixi run --manifest-path crates/ports/gpt_sovits_text/pixi.toml <task>
# or with `pixi run <task>` in this directory.
# pyopenjtalk is built from its sdist, which needs CMake and a C/C++ compiler.
[workspace]
name = "gpt_sovits_text-parity"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
# Keep 3.11: some generated tables depend on Python 3.11's Unicode 14 data.
python = "3.11.*"
numpy = "1.26.*"
onnxruntime = "==1.31.1"
pytorch = "==2.14.1"
transformers = "4.57.*"
nltk = "3.10.*"
inflect = "7.6.*"
requests = "==2.34.2"
pypinyin = "==0.55.0"
jieba = "==0.42.1"

[pypi-dependencies]
jieba_fast = "==0.53"
cn2an = "==0.5.24"
g2p_en = "==2.1.0"
wordsegment = "==1.3.1"
split-lang = "==2.1.1"
fast_langdetect = "==1.1.0"
ToJyutping = "==3.2.0"
opencc = "==1.4.2"
pyopenjtalk = "==0.4.1"

[tasks.upstream]
description = "Shallow-fetch GPT-SoVITS at the pinned commit into parity/.cache/GPT-SoVITS"
cmd = "python parity/fetch.py upstream"

[tasks.g2pw-model]
description = "Download and extract G2PWModel_1.1.zip into parity/.cache/G2PWModel"
cmd = "python parity/fetch.py g2pw-model"

[tasks.bert-tokenizer]
description = "Download the chinese-roberta-wwm-ext-large tokenizer into parity/.cache/run"
cmd = "python parity/fetch.py bert-tokenizer"

[tasks.lid-model]
description = "Download the fasttext lid.176.bin model into parity/.cache/fast_langdetect"
cmd = "python parity/fetch.py lid-model"

[tasks.assets]
description = "Fetch everything the generators need into parity/.cache"
depends-on = ["upstream", "g2pw-model", "bert-tokenizer", "lid-model"]

[tasks.fixtures]
description = "Regenerate tests/fixtures (pass module names to run only those)"
cmd = "python parity/regen.py fixtures"
depends-on = ["assets"]

[tasks.data]
description = "Regenerate data/ and the generated Rust tables (pass names to run only those)"
cmd = "python parity/regen.py data"
depends-on = ["upstream", "bert-tokenizer"]
