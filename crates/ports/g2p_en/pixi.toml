# Python reference environment for the g2p_en port. Versions are pinned so
# the golden fixtures are reproducible. See parity/README.md.
[workspace]
name = "g2p_en-parity"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"
numpy = "1.26.*"
nltk = "3.10.*"
inflect = "7.6.*"

[pypi-dependencies]
g2p_en = "==2.1.0"
wordsegment = "==1.3.1"

[tasks]
upstream = { cmd = "python parity/fetch.py upstream", description = "Fetch GPT-SoVITS 04a44eb into parity/.cache/GPT-SoVITS" }
nltk-data = { cmd = "python parity/fetch.py nltk-data", description = "Download the nltk packages into parity/.cache/nltk_data" }
fixtures = { cmd = "python parity/gen_fixtures.py", depends-on = ["upstream", "nltk-data"], description = "Regenerate tests/fixtures" }
data = { cmd = "python parity/copy_data.py", description = "Copy data/ from the pinned g2p_en package" }
