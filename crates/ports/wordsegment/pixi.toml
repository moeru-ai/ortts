# Python reference environment for the wordsegment port. Versions are pinned
# so the golden fixtures and data files are reproducible.
# Usage: pixi run --manifest-path crates/ports/wordsegment/pixi.toml <task>
[workspace]
name = "wordsegment-parity"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"

[pypi-dependencies]
wordsegment = "==1.3.1"

[tasks]
apache-license = { cmd = "python parity/fetch.py apache-license", description = "Download the Apache-2.0 license text into parity/.cache" }
fixtures = { cmd = "python parity/gen_fixtures.py", description = "Regenerate tests/fixtures (about 9 minutes)" }
data = { cmd = "python parity/copy_data.py", description = "Copy data/*.txt from the wordsegment 1.3.1 package" }
license = { cmd = "python parity/make_license.py", depends-on = ["apache-license"], description = "Regenerate LICENSE" }
