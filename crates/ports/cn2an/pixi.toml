# Python reference environment for the cn2an port. It generates the golden
# fixtures in tests/fixtures and the embedded tables in data/.
# Usage (from the repository root):
#   pixi run --manifest-path crates/ports/cn2an/pixi.toml fixtures
#   pixi run --manifest-path crates/ports/cn2an/pixi.toml data
[workspace]
name = "cn2an-parity"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
# Keep 3.11: data/python_decimal_ranges.txt is Python 3.11's `re` `\d`
# (Unicode 14.0).
python = "3.11.*"

[pypi-dependencies]
cn2an = "==0.5.24"
proces = "==0.1.7"

[tasks]
fixtures = "python parity/generate_fixtures.py"
data = "python parity/export_data.py"
