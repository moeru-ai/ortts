[workspace]
authors = ["Neko Ayaka <neko@ayaka.moe>"]
channels = ["conda-forge"]
name = "ortts"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
check = "cargo check --workspace"
test = "cargo test --workspace"
serve = "cargo run --release -- serve"

[target.linux-64.dependencies]
# ONNX Runtime's CUDA execution provider currently links against CUDA 12.
cuda = ">=12.9,<13"
cuda-cupti = ">=12.9,<13"
cuda-libraries-dev = ">=12.9,<13"
cuda-nvcc = ">=12.9,<13"
cuda-nvtx = ">=12.9,<13"
cudnn = ">=9.10,<9.11"
openssl = ">=3.6,<4"
pkg-config = ">=0.29,<0.30"

[target.linux-64.activation.env]
# CUDA's compiler packages activate a Conda sysroot that is older than the glibc used by
# ORT's prebuilt objects. Keep Rust and native dependency builds on the host toolchain.
AR = "/usr/bin/ar"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "/usr/bin/cc"
CC = "/usr/bin/cc"
CPP = "/usr/bin/cpp"
CXX = "/usr/bin/c++"
LD = "/usr/bin/ld"
LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/target/release:$CONDA_PREFIX/lib:$CONDA_PREFIX/targets/x86_64-linux/lib"
PATH = "/usr/bin:/bin:$HOME/.cargo/bin:$CONDA_PREFIX/bin:$PATH"

# Python reference environment for the GPT-SoVITS text frontend ports in
# crates/ports. Versions are pinned so golden fixtures are reproducible.
# Usage: pixi run -e parity python tools/parity/<script>.py
[feature.parity]
platforms = ["linux-64", "osx-arm64", "win-64"]

[feature.parity.dependencies]
python = "3.11.*"
numpy = "1.26.*"
onnxruntime = ">=1.20"
pytorch = ">=2.4"
transformers = "4.57.*"
nltk = "3.10.*"
inflect = "7.6.*"
requests = "*"
pypinyin = "==0.55.0"
jieba = "==0.42.1"

[feature.parity.pypi-dependencies]
jieba_fast = "==0.53"
cn2an = "==0.5.24"
g2p_en = "==2.1.0"
wordsegment = "==1.3.1"
split-lang = "==2.1.1"
fast_langdetect = "==1.1.0"
ToJyutping = "==3.2.0"
opencc = "==1.4.2"
pyopenjtalk = ">=0.4.1"

[environments]
parity = { features = ["parity"], no-default-feature = true }
